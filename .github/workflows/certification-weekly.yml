name: Certification Weekly Report
on:
  schedule:
    - cron: '0 8 * * 1'  # 8 AM UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install certify
        run: go install github.com/iksnae/code-certification/cmd/certify@v0.12.0

      # .certification/ is not tracked, so a fresh checkout carries no records.
      # The report has to certify the commit before it has anything to report.
      - name: Scan code units
        run: certify scan

      - name: Run certification
        run: certify certify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate weekly report
        run: certify report --format text

      - name: Generate JSON report
        run: certify report --format json > weekly-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: certification-weekly-${{ github.sha }}
          path: weekly-report.json
          if-no-files-found: error
          retention-days: 90
