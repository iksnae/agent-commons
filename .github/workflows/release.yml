name: Publish release archives

on:
  push:
    # A version pattern, not a glob: `vendor-freeze` must not publish binaries.
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      # Release archives are built with -buildvcs=false, so the tag is the only
      # thing a released binary can report about itself. Both steps take the
      # same version: the second rebuilds the shipped source and compares.
      - run: bash scripts/build-binaries.sh
        env:
          AGENT_COMMONS_VERSION: ${{ github.ref_name }}
      - run: bash scripts/check-archives.sh
        env:
          AGENT_COMMONS_VERSION: ${{ github.ref_name }}
      # gh ships on the runner; no third-party action is trusted with the token.
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            dist/*
